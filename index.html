<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Uncover New Zealand</title>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

<meta name="description" content="Uncover New Zealand. Discover the stories behind the land: a clear, friendly guide to the history, culture and places of Aotearoa, written by a newcomer for newcomers.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm reading column (max 1080px); a deep-water hero whose lower edge is a dawn horizon with a
   long white cloud; the Start Here path drawn as a walking track with orange route markers.
   Since the photographs were added, the hero is a shaded photo of Taranaki Maunga. */
:root {
  --bg: #F1F5F6;
  --surface: #FFFFFF;
  --ink: #10242B;
  --muted: #50656D;
  --line: #D2DDE1;
  --moana: #0B4F5C;
  --moana-soft: #DCEBEE;
  --on-moana: #FFFFFF;
  --marker: #E8590C;
  --marker-ink: #A83C00;
  --on-marker: #2B1200;
  --fern: #2C6A3E;
  --fern-soft: #E0EEE3;
  --clay: #8C3B2A;
  --clay-soft: #F4E5E0;
  --hero-bg: #08323D;
  --hero-ink: #F3FAFB;
  --hero-muted: #B9D6DB;
  --sky-low: #86BCC5;
  --cloud: #FFFFFF;
  --range-far: #0C4250;
  --hero-shade: rgba(5, 38, 48, 0.90);
  --hero-shade-mid: rgba(5, 38, 48, 0.74);
  --hero-shade2: rgba(5, 38, 48, 0.38);
  --hero-shade3: rgba(5, 38, 48, 0.74);
  --era1: #8CA0A7;
  --era2: #2C6A3E;
  --era3: #0B4F5C;
  --era4: #8C3B2A;
  --era5: #B9831A;
  --display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B181D; --surface: #12242B; --ink: #E6EFF1; --muted: #9BB1B8; --line: #25393F;
    --moana: #6DC6D2; --moana-soft: #14313A; --on-moana: #06262E;
    --marker: #FF8A3D; --marker-ink: #FF9E5E; --on-marker: #2B1200;
    --fern: #8FCB9B; --fern-soft: #16301F; --clay: #EBA797; --clay-soft: #3A211B;
    --hero-bg: #0A2A33; --hero-ink: #EEF6F8; --hero-muted: #A9C6CC;
    --sky-low: #2F6672; --cloud: #DCEAED; --range-far: #071E25;
    --era1: #6F858C; --era2: #5FA873; --era3: #4FA9B6; --era4: #D98A77; --era5: #E0AE4A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B181D; --surface: #12242B; --ink: #E6EFF1; --muted: #9BB1B8; --line: #25393F;
  --moana: #6DC6D2; --moana-soft: #14313A; --on-moana: #06262E;
  --marker: #FF8A3D; --marker-ink: #FF9E5E; --on-marker: #2B1200;
  --fern: #8FCB9B; --fern-soft: #16301F; --clay: #EBA797; --clay-soft: #3A211B;
  --hero-bg: #0A2A33; --hero-ink: #EEF6F8; --hero-muted: #A9C6CC;
  --sky-low: #2F6672; --cloud: #DCEAED; --range-far: #071E25;
  --era1: #6F858C; --era2: #5FA873; --era3: #4FA9B6; --era4: #D98A77; --era5: #E0AE4A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 1.0625rem; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--moana); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--marker-ink); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 700; }
h1:focus { outline: none; }
h2 { font-size: 1.5rem; font-weight: 700; }
h3 { font-size: 1.15rem; font-weight: 700; }
p { margin: 0; }
ul, ol { margin: 0; padding-left: 1.2em; }
li + li { margin-top: 0.35em; }

.wrap { max-width: 1080px; margin-inline: auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.prose { max-width: 66ch; display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
.prose > h2 { margin-top: 1rem; }
.lead { font-size: 1.2rem; color: var(--muted); max-width: 60ch; }
.label { font-family: var(--body); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.term { color: inherit; text-decoration: underline dotted; text-decoration-color: var(--moana); text-underline-offset: 3px; }
.term:hover { color: var(--moana); }

/* Header */
.site-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bg); border-bottom: 1px solid var(--line); }
.site-head .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; column-gap: 1.5rem; row-gap: 0.25rem; padding-block: 0.7rem; }
.brand { display: inline-flex; align-items: center; gap: 0.5rem; font-family: var(--display); font-weight: 700; font-size: 1.2rem; color: var(--ink); text-decoration: none; }
.brand .logo { height: 32px; width: auto; flex: none; }
.nav { display: flex; gap: 0.25rem; overflow-x: auto; max-width: 100%; min-width: 0; }
.nav a { white-space: nowrap; padding: 0.4rem 0.7rem; border-radius: 999px; color: var(--ink); text-decoration: none; font-weight: 500; font-size: 0.98rem; }
.nav a:hover { background: var(--moana-soft); }
.nav a[aria-current="page"] { background: var(--moana); color: var(--on-moana); }

/* Hero */
.hero { background: linear-gradient(100deg, var(--hero-shade) 0%, var(--hero-shade-mid) 50%, var(--hero-shade2) 100%), url("assets/hero.jpg") center 46% / cover no-repeat, var(--hero-bg); color: var(--hero-ink); }
.hero .wrap.top { padding-block: clamp(2.5rem, 7vw, 4.5rem); display: flex; flex-direction: column; gap: 1.25rem; }
.hero h1 { font-size: clamp(2.3rem, 6.5vw, 4.25rem); max-width: 15ch; }
.hero p { color: var(--hero-muted); font-size: 1.2rem; max-width: 52ch; }
.hero .label { color: var(--hero-muted); }
.hero p.credit { font-size: 0.8rem; margin-top: 0.5rem; }
.hero .credit a { color: inherit; }
@media (max-width: 700px) { .hero { background: linear-gradient(180deg, var(--hero-shade), var(--hero-shade3)), url("assets/hero.jpg") center / cover no-repeat, var(--hero-bg); } }

/* Photographs */
.shot { margin: 0; max-width: 46rem; }
.shot.tall { max-width: 24rem; }
.shot img { display: block; width: 100%; height: auto; border-radius: 10px; background: var(--moana-soft); }
.shot figcaption { margin-top: 0.45rem; font-size: 0.85rem; color: var(--muted); }
.shot figcaption a { color: inherit; }
.btns { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 0.5rem; }
.btn { display: inline-block; padding: 0.7rem 1.2rem; border-radius: 999px; font-weight: 600; text-decoration: none; border: 2px solid transparent; }
.btn-main { background: var(--marker); color: var(--on-marker); }
.btn-ghost { border-color: var(--hero-muted); color: var(--hero-ink); }
.btn-solid { background: var(--moana); color: var(--on-moana); }

/* Sections */
.section { padding-block: clamp(2rem, 5vw, 3.25rem); }
.section + .section { border-top: 1px solid var(--line); }
.section > .wrap { display: flex; flex-direction: column; gap: 1.25rem; }
.page-head { padding-block: clamp(1.75rem, 4vw, 2.75rem) 0.5rem; }
.page-head .wrap { display: flex; flex-direction: column; gap: 0.75rem; }
.back { font-size: 0.95rem; font-weight: 500; text-decoration: none; }
.back:hover { text-decoration: underline; }
.more { font-weight: 600; text-decoration: none; }
.more:hover { text-decoration: underline; }

/* Start Here panel on the home page */
.startbox { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 1.5rem 3rem; align-items: center; }
.startbox > div { display: flex; flex-direction: column; gap: 0.9rem; min-width: 0; align-items: flex-start; }
.nextstop { display: flex; gap: 0.9rem; align-items: flex-start; padding: 1.1rem 1.25rem; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); width: 100%; }
.nextstop:hover { border-color: var(--marker); }
.nextstop svg { width: 22px; height: 20px; flex: none; margin-top: 0.3rem; }
.nextstop span { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }
.nextstop strong { font-family: var(--display); font-size: 1.2rem; line-height: 1.25; }

/* The track: the Start Here path as a marked walking route */
.track { list-style: none; margin: 0; padding: 0; position: relative; display: flex; flex-direction: column; max-width: 46rem; }
.track::before { content: ""; position: absolute; left: 13px; top: 1.6rem; bottom: 1.6rem; border-left: 2px dashed var(--line); }
.track li { margin: 0; position: relative; }
.track a { display: grid; grid-template-columns: 28px minmax(0, 1fr); column-gap: 1rem; padding-block: 0.9rem; text-decoration: none; color: var(--ink); }
.track .mk { display: flex; justify-content: center; padding-top: 0.2rem; background: var(--bg); align-self: start; padding-bottom: 0.2rem; }
.track .mk svg { width: 24px; height: 22px; }
.tri-line { fill: var(--bg); stroke: var(--marker); stroke-width: 2; stroke-linejoin: round; }
.tri-fill { fill: var(--marker); stroke: var(--marker); stroke-width: 2; stroke-linejoin: round; }
.track .tx { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }
.track .q { font-family: var(--display); font-weight: 700; font-size: 1.3rem; line-height: 1.2; }
.track a:hover .q { color: var(--moana); text-decoration: underline; }
.track .bl { color: var(--muted); font-size: 0.98rem; }
.track .meta { font-size: 0.82rem; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.track .meta b { color: var(--marker-ink); font-weight: 700; }
.soon { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 0.35rem; color: var(--muted); }
.soon li { margin: 0; }

/* Question links */
.qlist { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 0 2.5rem; }
.qlist li { margin: 0; border-bottom: 1px solid var(--line); }
.qlist a { display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; padding-block: 0.9rem; font-family: var(--display); font-weight: 700; font-size: 1.15rem; line-height: 1.25; color: var(--ink); text-decoration: none; }
.qlist a:hover { color: var(--moana); }
.qlist a span:last-child { color: var(--marker-ink); flex: none; }

/* Timeline (to scale) */
.tl { display: flex; flex-direction: column; gap: 0.35rem; }
.tl-cap { font-size: 0.88rem; color: var(--muted); max-width: 66ch; }
.tl-row { position: relative; height: 30px; background: var(--line); border-radius: 4px; overflow: hidden; }
.tl-seg { position: absolute; top: 0; bottom: 0; box-shadow: inset -2px 0 0 var(--bg); }
.tl-ticks { position: relative; height: 1.6rem; font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tl-ticks span { position: absolute; top: 0.3rem; white-space: nowrap; transform: translateX(-50%); }
.tl-ticks span.first { transform: none; }
.tl-ticks span.last { transform: translateX(-100%); }
@media (max-width: 640px) { .tl-ticks span.opt { display: none; } }
.t1 { background: var(--era1); } .t2 { background: var(--era2); } .t3 { background: var(--era3); } .t4 { background: var(--era4); } .t5 { background: var(--era5); }

.eras { list-style: none; padding: 0; display: flex; flex-direction: column; }
.eras li { margin: 0; display: grid; grid-template-columns: 9.5rem minmax(0, 1fr); column-gap: 2rem; padding-block: 1.25rem; border-top: 1px solid var(--line); }
.eras .when { display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.88rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.eras .when .n { display: flex; align-items: center; gap: 0.5rem; font-family: var(--display); font-size: 1.5rem; font-weight: 700; line-height: 1; }
.eras .when .n i { width: 12px; height: 12px; border-radius: 2px; }
.eras .what { display: flex; flex-direction: column; gap: 0.45rem; min-width: 0; }
.eras .what p { color: var(--muted); max-width: 62ch; }
.eras .note { font-size: 0.85rem; color: var(--muted); }
@media (max-width: 640px) { .eras li { grid-template-columns: minmax(0, 1fr); row-gap: 0.5rem; } .eras .when { flex-direction: row; align-items: baseline; gap: 0.75rem; } .eras .when .n { font-size: 1.2rem; } }

/* Cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 1rem; }
.card { display: flex; flex-direction: column; gap: 0.6rem; padding: 1.1rem 1.15rem 1.15rem; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.card:hover { border-color: var(--moana); }
.card p { color: var(--muted); font-size: 0.97rem; }
.card .meta { margin-top: auto; padding-top: 0.4rem; font-size: 0.85rem; color: var(--muted); }
.card.pic { padding: 0; gap: 0; overflow: hidden; }
.card.pic img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; object-fit: cover; background: var(--moana-soft); }
.card.pic .bd { display: flex; flex-direction: column; gap: 0.6rem; flex: 1; padding: 1rem 1.15rem 1.15rem; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.chip { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 0.15rem 0.55rem; border-radius: 999px; }
.chip.heritage { background: var(--clay-soft); color: var(--clay); }
.chip.nature { background: var(--fern-soft); color: var(--fern); }

/* Article furniture */
.short { max-width: 66ch; padding: 1.15rem 1.3rem; background: var(--moana-soft); border-radius: 10px; display: flex; flex-direction: column; gap: 0.4rem; }
.short p { font-size: 1.1rem; }
.why { max-width: 66ch; color: var(--muted); }
.facts { display: grid; grid-template-columns: minmax(7rem, max-content) minmax(0, 1fr); gap: 0.5rem 1.25rem; margin: 0; padding: 1.1rem 1.25rem; background: var(--moana-soft); border-radius: 10px; max-width: 66ch; }
.facts dt { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding-top: 0.2rem; }
.facts dd { margin: 0; }
@media (max-width: 480px) { .facts { grid-template-columns: 1fr; gap: 0.1rem; } .facts dd { margin-bottom: 0.6rem; } }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 1.25rem; padding-block: 1.1rem; border-block: 1px solid var(--line); max-width: 66ch; }
.pair > div { display: flex; flex-direction: column; gap: 0.35rem; min-width: 0; }
.pair .label.a { color: var(--marker-ink); }
.pair .label.b { color: var(--moana); }
.pair p { font-size: 0.98rem; }
.words { max-width: 66ch; display: flex; flex-direction: column; gap: 0.75rem; }
.words dl, .gloss { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 0.75rem 2rem; margin: 0; }
.words dl div, .gloss div { min-width: 0; }
.words dt, .gloss dt { font-weight: 700; display: inline; }
.words dd, .gloss dd { margin: 0; display: inline; color: var(--muted); }
.gloss div { padding: 0.15rem 0.4rem; margin-inline: -0.4rem; border-radius: 6px; }
.gloss div.hit { background: var(--moana-soft); }
.links { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.pill { padding: 0.35rem 0.85rem; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); text-decoration: none; font-weight: 500; font-size: 0.95rem; }
.pill:hover { border-color: var(--moana); }
.src { max-width: 66ch; display: flex; flex-direction: column; gap: 0.5rem; font-size: 0.95rem; }
.src ul { padding-left: 1.1em; }
.src .rev { color: var(--muted); font-size: 0.85rem; }
.onward { display: flex; flex-direction: column; gap: 0.75rem; max-width: 46rem; }
.respect { max-width: 66ch; padding-left: 1rem; border-left: 3px solid var(--marker); }

/* Glossary search */
.find { display: flex; flex-direction: column; gap: 0.35rem; max-width: 26rem; }
.find input { font: inherit; padding: 0.6rem 0.85rem; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); width: 100%; }

.offlinks { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 0.9rem 2rem; }
.offlinks li { margin: 0; display: flex; flex-direction: column; min-width: 0; }
.offlinks span { color: var(--muted); font-size: 0.95rem; }
.approach { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 1.5rem 2.5rem; }
.approach div { display: flex; flex-direction: column; gap: 0.35rem; min-width: 0; }
.approach p { color: var(--muted); }
.tiers { display: flex; flex-direction: column; gap: 1.5rem; }
.tiers > div { display: flex; flex-direction: column; gap: 0.4rem; max-width: 66ch; }
.tiers p { color: var(--muted); }

.cta { background: var(--moana-soft); }
footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 0.9rem; }
footer .wrap { padding-block: 1.5rem; display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; justify-content: space-between; }
@media (prefers-reduced-motion: no-preference) { .card, .nav a, .pill, .nextstop { transition: border-color 0.15s, background-color 0.15s; } }
</style>
</head>

<script>
/* Uncover New Zealand: glossary. g: "reo" = te reo Māori, "kiwi" = New Zealand English. */
window.ENZ = window.ENZ || {};
window.ENZ.glossary = [
  { t: "Aotearoa", g: "reo", d: "The Māori name now widely used for New Zealand, often translated as “land of the long white cloud”." },
  { t: "aroha", g: "reo", d: "Love, compassion, empathy." },
  { t: "awa", g: "reo", d: "River." },
  { t: "haka", g: "reo", d: "A posture dance performed with chanted words. There are many kinds, for welcome, celebration, challenge and mourning." },
  { t: "hāngī", g: "reo", d: "Food cooked in an earth oven over heated stones; also the oven itself." },
  { t: "hapū", g: "reo", d: "A kinship group made up of related whānau. Traditionally the main political unit of Māori society." },
  { t: "Hawaiki", g: "reo", d: "The ancestral homeland from which, in tradition, the ancestors of Māori voyaged." },
  { t: "hui", g: "reo", d: "A gathering or meeting." },
  { t: "iwi", g: "reo", d: "A tribe: a large group descended from a common ancestor, made up of related hapū." },
  { t: "kai", g: "reo", d: "Food; to eat." },
  { t: "kaitiaki", g: "reo", d: "A guardian or caretaker. Kaitiakitanga is guardianship, especially of the natural world." },
  { t: "karakia", g: "reo", d: "A prayer or incantation, often said to open or close a gathering." },
  { t: "kaumātua", g: "reo", d: "Elders; respected older people." },
  { t: "kauri", g: "reo", d: "A giant native conifer of the northern North Island, among the largest and longest-lived trees in the world." },
  { t: "kāwanatanga", g: "reo", d: "Governance or government. The word used in article one of te Tiriti o Waitangi." },

  {

    q: "Why does New Zealand have two names?",
    blurb: "One name came from Dutch mapmakers, the other from the first people here. Both are in daily use.",
    short: "“New Zealand” comes from Dutch mapmakers, who named the land Nova Zeelandia after the Dutch province of Zeeland in the 1640s. “Aotearoa” is the Māori name, usually translated as “land of the long white cloud”. Both are in everyday use, and you will often see them together as Aotearoa New Zealand.",

        "That guess was soon shown to be wrong. On a world map of 1646 Joan Blaeu, mapmaker to the Dutch East India Company, gave the coastline the Latin name Nova Zeelandia. In Dutch that is Nieuw Zeeland, after Zeeland, a low-lying coastal province of the Netherlands. In English it became New Zealand.",

    q: "Who were the first people to arrive?",
    blurb: "Polynesian voyagers crossed thousands of kilometres of open ocean and settled the last large land on Earth.",
    short: "The first people to settle New Zealand were Polynesians who sailed here from East Polynesia in voyaging canoes around 1250 to 1300 CE. Their descendants are Māori. New Zealand was one of the last large landmasses on Earth to be settled by people.",
    why: "It is easy to assume a country’s history starts when written records do. Here, the human story is short by world standards, about 750 years, and it begins with one of the great feats of navigation.",

      ["A new kind of land", [

    short: "The Treaty of Waitangi, te Tiriti o Waitangi, is an agreement first signed on 6 February 1840 between the British Crown and Māori rangatira (chiefs). It is regarded as New Zealand’s founding document. Its English and Māori texts say different things about who holds authority, and the country is still working through that difference.",

        "On 5 February 1840 it was put to around 500 Māori at Waitangi in the Bay of Islands, and debated all day. The next day, 6 February, more than 40 [[rangatira]] signed. Copies were then carried around the country. In the end more than 500 rangatira signed, including at least 13 women.",
        "Not everyone agreed. Some rangatira refused to sign, and others were never asked. In May 1840 Hobson proclaimed British sovereignty over the whole country."
      ]],

        "In the second article, the English text guarantees Māori possession of their lands, forests and fisheries, and gives the Crown the sole right to buy land from them. The Māori text promises [[tino rangatiratanga]], full chieftainship, over their lands, villages and [[taonga]] (treasures).",
        "The third article gives Māori the Queen’s protection and the rights of British subjects. Here the two texts match closely."

      ["What happened next", [

      ]]
    ],

        '<section class="section"><div class="wrap">' +
        '<div class="short"><span class="label">The short answer</span><p>' + x.short + "</p></div>" +
        '<p class="why"><strong>Why it matters to you.</strong> ' + why + "</p>" + shotsFor(x.id) +
        '<div class="prose">' + body + "</div>" + pairBox(x.pair) + wordsBox() +
        (x.see.length ? '<div class="onward"><h2 class="label">See it for yourself</h2><div class="links">' + pills(x.see) + "</div></div>" : "") +
        '<div class="onward"><h2 class="label">' + (next ? "Next on the path · Stop " + next.n + " of 10" : "End of the path") + "</h2>" +
        (next
          ? '<a class="nextstop" href="#' + next.id + '">' + tri(false) + "<span><strong>" + next.q + "</strong><span>" + next.blurb + "</span></span></a>"
          : '<a class="nextstop" href="#story">' + tri(true) + "<span><strong>You have reached the last stop.</strong><span>Keep going with The Story, or pick a place to visit.</span></span></a>") +
        "</div>" + sources(x.sources) + "</div></section>";
      used = null;
      markRead(x.id);
      return html;
    },

    story: function () {
      return '<div class="page-head"><div class="wrap"><span class="label">The Story</span><h1 tabindex="-1">About 750 years, in five eras</h1>' +
        '<p class="lead">New Zealand’s human history is short and unusually well recorded, in memory, in the ground and on paper. This is the joined-up version.</p></div></div>' +
        '<section class="section"><div class="wrap">' + timeline() + '<ol class="eras">' + E.eras.map(function (e) {
          return '<li><div class="when"><span class="n"><i class="' + e.tone + '"></i>' + e.n + "</span><span>" + e.dates + '</span></div><div class="what"><h2>' + e.name + "</h2><p>" + e.summary + "</p>" +
            (e.full ? '<a class="more" href="#' + e.id + '">Read the full story of this era</a>'
              : '<a class="more" href="#' + e.link + '">' + e.linkLabel + '</a><span class="note">A full page for this era is being written.</span>') + "</div></li>";
        }).join("") + "</ol></div></section>";
    },

    era: function () {
      var p = E.eraPage;
      used = new Set();
      var body = sections(p.sections);
      var html = '<div class="page-head"><div class="wrap"><a class="back" href="#story">← The Story · Era 3 of 5</a><h1 tabindex="-1">' + p.title + '</h1><p class="lead">' + p.lead + "</p></div></div>" +
        '<section class="section"><div class="wrap"><dl class="facts">' + p.facts.map(function (f) { return "<dt>" + f[0] + "</dt><dd>" + f[1] + "</dd>"; }).join("") + "</dl>" +
        '<div class="prose">' + body + "</div>" + wordsBox() +
        '<div class="onward"><h2 class="label">See it today</h2><div class="links">' + pills(p.see) + "</div></div>" +
        '<div class="onward"><h2 class="label">Related questions</h2><div class="links">' + pills(p.related) + "</div></div>" +
        sources(p.sources) + "</div></section>";
      used = null;
      return html;
    },

    places: function () {
      return '<div class="page-head"><div class="wrap"><span class="label">Places</span><h1 tabindex="-1">Places that tell the story</h1>' +
        '<p class="lead">Every place here is chosen for what it explains about the country, not only for how it looks. This first set covers Northland, where the Treaty was signed and the first war was fought.</p></div></div>' +
        '<section class="section"><div class="wrap"><div class="grid">' + PLACES.map(placeCard).join("") + "</div></div></section>" +
        '<section class="section"><div class="wrap"><h2>Coming next</h2><p class="lead">The rest of the country, one region at a time.</p><ul class="soon">' +
        E.placesNext.map(function (s) { return "<li>" + s + "</li>"; }).join("") + "</ul></div></section>";
    },

    place: function (p) {
      used = new Set();
      var story = paras(p.story);
      var see = p.seeList.map(function (s) { return "<li>" + rich(s) + "</li>"; }).join("");
      var html = '<div class="page-head"><div class="wrap"><a class="back" href="#places">← Places</a>' +
        '<div class="chips"><span class="chip ' + p.kind + '">' + (p.kind === "nature" ? "Nature" : "Heritage") + "</span></div>" +
        '<h1 tabindex="-1">' + p.name + '</h1><p class="lead">' + p.hook + "</p></div></div>" +
        '<section class="section"><div class="wrap"><dl class="facts">' + p.facts.map(function (f) { return "<dt>" + f[0] + "</dt><dd>" + f[1] + "</dd>"; }).join("") + "</dl>" +
        shotsFor(p.id, 0, 1) + '<div class="prose"><h2>The story</h2>' + story + "<h2>What you will see</h2><ul>" + see + "</ul><h2>Visiting basics</h2><p>" + p.basics + "</p>" +
        (p.respect ? '<h2>How to show respect</h2><p class="respect">' + p.respect + "</p>" : "") + "</div>" + shotsFor(p.id, 1) + wordsBox() +
        '<div class="onward"><h2 class="label">Read the background</h2><div class="links">' + pills(p.related) + (p.eras.indexOf("era-encounters") >= 0 ? pills(["era-encounters"]) : '<a class="pill" href="#story">The Story</a>') + "</div></div>" +
        sources(p.sources) + "</div></section>";
      used = null;
      return html;
    },

    glossary: function () {
      function group(k) {
        return E.glossary.map(function (g, i) { return g.g === k ? '<div id="g-' + i + '" data-s="' + attr(norm(g.t + " " + g.d)) + '"><dt>' + g.t + "</dt> <dd>" + g.d + "</dd></div>" : ""; }).join("");
      }
      return '<div class="page-head"><div class="wrap"><span class="label">Glossary</span><h1 tabindex="-1">Words you will hear</h1>' +
        '<p class="lead">Te reo Māori and New Zealand English, in plain terms. Meanings here are short on purpose. For fuller definitions of Māori words, use <a href="https://maoridictionary.co.nz" target="_blank" rel="noopener">Te Aka Māori Dictionary</a>.</p>' +
        '<div class="find"><label class="label" for="gloss-q">Find a word</label><input id="gloss-q" type="search" autocomplete="off" placeholder="Try whānau, or togs"></div></div></div>' +
        '<section class="section"><div class="wrap"><h2>Te reo Māori</h2><dl class="gloss" id="gl-reo">' + group("reo") + "</dl></div></section>" +
        '<section class="section"><div class="wrap"><h2>Kiwi English</h2><dl class="gloss" id="gl-kiwi">' + group("kiwi") + '</dl><p id="gl-none" class="lead" hidden>No words match. Try a shorter search.</p></div></section>';
    },

    bearings: function () {
      var b = E.bearings;
      used = new Set();
      var body = sections(b.items);
      used = null;
      return '<div class="page-head"><div class="wrap"><span class="label">Your bearings</span><h1 tabindex="-1">Getting your bearings</h1><p class="lead">' + b.lead + "</p></div></div>" +
        '<section class="section"><div class="wrap"><div class="prose">' + body + "</div></div></section>" +
        '<section class="section"><div class="wrap"><h2>Official sites for anything that changes</h2><ul class="offlinks">' +
        b.links.map(function (l) { return '<li><a href="' + l[2] + '" target="_blank" rel="noopener">' + l[0] + "</a><span>" + l[1] + "</span></li>"; }).join("") + "</ul></div></section>";
    },

    about: function () {
      var a = E.about;
      return '<div class="page-head"><div class="wrap"><span class="label">About</span><h1 tabindex="-1">Written by a newcomer, for newcomers</h1></div></div>' +
        '<section class="section"><div class="wrap"><div class="prose">' + a.about.map(function (p) { return "<p>" + p + "</p>"; }).join("") +
        '<p>You can find me on <a href="https://www.linkedin.com/in/shihansabir/" target="_blank" rel="noopener">LinkedIn</a>.</p></div></div></section>' +
        '<section class="section"><div class="wrap"><h2>Our approach</h2><div class="approach">' + a.approach.map(function (x) { return "<div><h3>" + x[0] + "</h3><p>" + x[1] + "</p></div>"; }).join("") + "</div></div></section>" +
        '<section class="section"><div class="wrap"><h2>Sources</h2><p class="lead">Every page lists its own sources. These are the ones the site relies on most.</p><div class="tiers">' +
        a.tiers.map(function (t) {
          return "<div><h3>" + t[0] + "</h3><p>" + t[1] + "</p><ul>" + t[2].map(function (s) { return "<li>" + (s[1] ? '<a href="' + s[1] + '" target="_blank" rel="noopener">' + s[0] + "</a>" : s[0]) + "</li>"; }).join("") + "</ul></div>";
        }).join("") + '</div><p class="tl-cap">' + a.notUsed + "</p></div></section>" +
        '<section class="section"><div class="wrap"><h2>Corrections</h2><div class="prose"><p>To report an error or suggest an improvement, send me a message on <a href="https://www.linkedin.com/in/shihansabir/" target="_blank" rel="noopener">LinkedIn</a>. Please include the page and, if you can, a source.</p>' +
        "<h2>Image credits</h2><p>Photographs and artworks are used under free licences. Each is credited where it appears, and all are listed here.</p><ul>" +
        Object.keys(IMG).map(function (k) { return "<li>" + IMG[k].name + ": " + credit(IMG[k]) + "</li>"; }).join("") + "</ul></div></div></section>";
    }
  };

  function route() {
    var id = (location.hash || "#home").slice(1) || "home";
    var html, key = id, title = "";
    var f = find(id);
    if (f && f.type === "q") { html = views.q(f.d); key = "start"; title = f.d.q; }
    else if (f && f.type === "place") { html = views.place(f.d); key = "places"; title = f.d.name; }
    else if (id === "era-encounters") { html = views.era(); key = "story"; title = E.eraPage.title; }
    else if (views[id] && id !== "q" && id !== "place" && id !== "era") { html = views[id](); title = { start: "Start Here", story: "The Story", places: "Places", glossary: "Glossary", bearings: "Getting your bearings", about: "About" }[id] || ""; }
    else { html = views.home(); key = "home"; }
    app.innerHTML = html;
    document.title = (title ? title + " · " : "") + "Uncover New Zealand";
    Array.prototype.forEach.call(document.querySelectorAll(".nav a"), function (a) {
      if (a.getAttribute("data-k") === key) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    if (key === "glossary") bindGlossary();
    if (key === "glossary" && pendingTerm !== null) {
      var el = document.getElementById("g-" + pendingTerm);
      pendingTerm = null;
      if (el) { firstLoad = false; el.classList.add("hit"); el.scrollIntoView({ block: "center" }); return; }
    }
    if (!firstLoad) {
      window.scrollTo(0, 0);
      var h = app.querySelector("h1");
      if (h) h.focus({ preventScroll: true });
    }
    firstLoad = false;
  }

  function bindGlossary() {
    var q = document.getElementById("gloss-q");
    if (!q) return;
    q.addEventListener("input", function () {
      var v = norm(q.value.trim()), shown = 0;
      Array.prototype.forEach.call(document.querySelectorAll(".gloss div[data-s]"), function (d) {
        var ok = !v || d.getAttribute("data-s").indexOf(v) >= 0;
        d.hidden = !ok; if (ok) shown++;
      });
      document.getElementById("gl-none").hidden = shown > 0;
    });
  }

  document.addEventListener("click", function (ev) {
    var a = ev.target.closest ? ev.target.closest("a.term") : null;
    if (!a) return;
    pendingTerm = a.getAttribute("data-term");
    if ((location.hash || "") === "#glossary") { ev.preventDefault(); route(); }
  });
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
